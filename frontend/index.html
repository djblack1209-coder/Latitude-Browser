<!doctype html>
<html lang="en-US" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a09" />
    <title>Latitude Browser</title>
    <style>
      html,body{margin:0;background:#080a09;color:#edf1e9}
      #latitude-splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;background:#080a09;pointer-events:auto;font:24px/32px 'JetBrains Mono',ui-monospace,monospace;isolation:isolate}#latitude-splash:before{content:'';position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#bcacee45 .7px,transparent 1px);background-size:18px 18px;mask-image:radial-gradient(ellipse at center,#000,transparent 55%)}
      #latitude-splash[hidden]{display:none}.splash-word{display:flex;align-items:center}.splash-word span{width:0;overflow:hidden;white-space:nowrap;animation:type 400ms 120ms steps(8) forwards}.splash-word b{font-weight:400;color:#d2fa69;text-shadow:0 0 8px #d2fa6933;animation:blink 120ms 1}
      .splash-line{height:1px;background:#d2fa69;transform:scaleX(0);transform-origin:left;animation:lock 160ms 520ms forwards}.splash-version{margin-top:12px;color:#889482;font-size:11px;opacity:0;animation:reveal 160ms 520ms forwards}
      @keyframes type{to{width:8ch}}@keyframes blink{50%{opacity:0}}@keyframes lock{to{transform:scaleX(1)}}@keyframes reveal{to{opacity:1}}
      @media(prefers-reduced-motion:reduce){.splash-word span{width:8ch;animation:none}.splash-word b,.splash-line,.splash-version{animation:none}.splash-line{transform:scaleX(1)}.splash-version{opacity:1}}
      #dev-boot-status{position:fixed;inset:0;z-index:9998;place-content:center;background:#080a09;color:#adb5aa;font:13px/20px system-ui}#dev-boot-status:not([hidden]){display:grid}#dev-boot-status button{margin-top:16px;background:#191d1a;color:#edf1e9;border:1px solid #3d473e;padding:4px 12px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="latitude-splash" hidden aria-hidden="true"><div class="splash-word"><span>latitude</span><b>▍</b></div><div class="splash-line"></div><div class="splash-version">Latitude Browser / v__LATITUDE_VERSION__</div></div>
    <script>
      ;(()=>{const el=document.getElementById('latitude-splash');let seen=false;try{seen=!!sessionStorage.getItem('latitude.splash');sessionStorage.setItem('latitude.splash','1')}catch{}if(__LATITUDE_DEV__||seen){el.remove();return}el.hidden=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,start=performance.now();let closed=false,timer,cap;const events=['keydown','pointerdown','wheel'];function done(){el.remove();clearTimeout(timer);clearTimeout(cap);window.removeEventListener('latitude:ready',ready);events.forEach(e=>window.removeEventListener(e,skip,true))}function finish(skip){if(closed)return;closed=true;if(reduced){done();return}el.style.transition=`opacity ${skip?80:180}ms`;el.style.opacity='0';timer=setTimeout(done,skip?80:180)}function ready(){if(!window.__LATITUDE_READY__)return;const wait=reduced?0:Math.max(0,680-(performance.now()-start));timer=setTimeout(()=>finish(false),wait)}function skip(e){e.preventDefault();e.stopImmediatePropagation();finish(true)}events.forEach(e=>window.addEventListener(e,skip,{capture:true,passive:false}));window.addEventListener('latitude:ready',ready);cap=setTimeout(done,2500);ready()})()
    </script>
    <div id="dev-boot-status" hidden role="status"><span></span><button type="button" onclick="location.reload()"></button></div>
    <script>
      ;(()=>{if(!__LATITUDE_DEV__)return;const words=__DEV_BOOT_WORDS__,lang=navigator.language.toLowerCase().startsWith('zh')?'zh':'en',el=document.getElementById('dev-boot-status');el.querySelector('span').textContent=words[lang][0];el.querySelector('button').textContent=words[lang][1];const timer=setTimeout(()=>{if(!window.__LATITUDE_READY__)el.hidden=false},2500);window.addEventListener('latitude:ready',()=>{clearTimeout(timer);el.remove()},{once:true})})()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
