name: Publish macOS Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version override, for example 1.3.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build unsigned macOS package
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(--arch "${{ matrix.arch }}")
          if [[ -n "$VERSION" ]]; then
            args+=(--version "$VERSION")
          fi
          bash publish/mac/publish-mac.sh "${args[@]}"

      - name: Validate app bundle
        env:
          PACKAGE_MANIFEST: ${{ steps.package.outputs.manifest }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_MANIFEST"
          python3 publish/mac/artifact_contract.py validate \
            --manifest "$PACKAGE_MANIFEST" --arch "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: latitude-browser-macos-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.manifest }}
          if-no-files-found: error
