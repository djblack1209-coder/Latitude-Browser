      <path id="left-eyelet" class="detail" d="M428.5 675 Q437.5 670 441.5 678 L447.5 690 L437.5 693Z"/>
      <use class="detail" href="#left-eyelet" transform="translate(1024 0) scale(-1 1)"/>
      <path id="left-cord-tip" class="detail" d="M440.5 911 H447.5 Q451.5 911 451.5 915 V926 H446.5 V920 H441.5 V938
        H446.5 V932 H451.5 V946 H437.5 Q434.5 946 434.5 943 V917 Q434.5 911 440.5 911Z"/>
      <use class="detail" href="#left-cord-tip" transform="translate(1024 0) scale(-1 1)"/>
    </g>
  </g>
</svg>
