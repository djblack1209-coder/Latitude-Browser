        M211.5 875.5 H218.5 C222.5 908.5 228.5 951.5 231.5 979.5 C223.5 950.5 215.5 907.5 211.5 875.5Z
        M834.5 718.5 C835.5 742.5 822.5 816.5 814.5 865.5 L807.5 864.5 C814.5 817.5 825.5 747.5 832.5 718.5Z
        M806.5 876.5 H813.5 C807.5 910.5 799.5 951.5 792.5 980.5 C795.5 952.5 801.5 909.5 806.5 876.5Z"/>
      <path class="detail" d="M125.5 758 C145.5 792 171.5 844 182.5 866 C160.5 850 136.5 795 125.5 758Z
        M122.5 856.5 C139.5 873.5 160.5 903.5 175.5 926.5 C152.5 914.5 132.5 881.5 122.5 856.5Z
        M171.5 942 C181.5 943 202.5 975 210.5 990 C191.5 975 174.5 951 171.5 942Z
        M898.5 758 C887.5 795 862.5 850 840.5 866 C852.5 844 878.5 792 898.5 758Z
        M902.5 855.5 C890.5 883.5 870.5 914.5 848.5 925.5 C864.5 900.5 885.5 874.5 902.5 855.5Z
        M853.5 941 C850.5 950 832.5 975 813.5 990 C821.5 975 843.5 943 853.5 941Z"/>
